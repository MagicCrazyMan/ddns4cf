# ============================================================================
# ddns4cf 配置文件模板（TOML）
#
# 使用方法：
#   1. 复制本文件为 config.toml，放到可执行文件所在目录；
#      或通过 `-c/--config <FILE>` 参数指定配置文件路径。
#   2. 按需修改下方配置，未填写的可选项会使用默认值。
#   3. token 属于敏感信息，请勿将真实配置提交到版本库。
# ============================================================================

# 绑定的本地 IP 地址（可选）。
# 当本机有多个网卡/地址时，可指定使用该地址向外发起请求。
# bind_address = "0.0.0.0"

# 全局刷新间隔，单位秒，默认 900 秒（15 分钟）。
# 若某个域名单独配置了 fresh_interval，则以域名配置为准。
fresh_interval = 900

# 全局出现错误时的重试间隔，单位秒，默认 300 秒（5 分钟）。
# 若某个域名单独配置了 retry_interval，则以域名配置为准。
retry_interval = 300

# 全局 IP 地址来源，支持以下取值：
#   1：独立服务器，需同时指定服务器地址，写法见下方 accounts.domains 中的示例；
#   2：本地 IPv6 查询（依据本机网络接口地址获取，仅 Linux / Windows）。
#      也可用表形式指定网卡名称：{ type = 2, interface = "eth0" }
# 注意：0（IpIp）已废弃并移除，请勿使用。
ip_source = 2

# ---------------------------------------------------------------------------
# Cloudflare 访问代理（可选，默认使用系统全局代理设置）。
# 支持 http、https、socks5 协议；不需要验证时可省略 username / password。
# ---------------------------------------------------------------------------
# [proxy]
# url = "socks5://127.0.0.1:1080"
# username = "user"
# password = "pass"

# ---------------------------------------------------------------------------
# Cloudflare 账号列表。
# 可重复书写 [[accounts]] 以配置多个账号。
# ---------------------------------------------------------------------------
[[accounts]]
# Cloudflare API token，建议使用仅具备 DNS 编辑权限的 token
token = "your_cloudflare_api_token"

# ---------------------------------------------------------------------------
# 当前账号下需要动态更新的域名记录。
# 可重复书写 [[accounts.domains]] 以配置该账号下的多条记录。
# ---------------------------------------------------------------------------
[[accounts.domains]]
# 域名昵称，仅用于日志输出，便于区分不同记录
nickname = "home.example.com"
# Cloudflare 中该 DNS 记录的 id
id = "record_id"
# Cloudflare 中该域名（zone）的 id
zone_id = "zone_id"

# 以下均为可选配置，未配置时使用全局配置。

# 绑定地址，未配置时使用全局 bind_address
# bind_address = "0.0.0.0"

# 刷新间隔，单位秒，未配置时使用全局 fresh_interval
# fresh_interval = 1200

# 重试间隔，单位秒，未配置时使用全局 retry_interval
# retry_interval = 300

# IP 地址来源，未配置时使用全局 ip_source
#   独立服务器：type = 1，必须同时指定 server
#     ip_source = { type = 1, server = "http://127.0.0.1:8000/ip" }
#   本地 IPv6：
#     ip_source = 2
#     ip_source = { type = 2, interface = "eth0" }
# ip_source = { type = 1, server = "http://127.0.0.1:8000/ip" }
