name: Publish Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ddns4f

jobs:
  build-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build static binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Prepare Docker build context
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-context"
          cp target/x86_64-unknown-linux-musl/release/ddns4cf "${RUNNER_TEMP}/docker-context/ddns4cf"
          cp docker/Dockerfile "${RUNNER_TEMP}/docker-context/Dockerfile"

      - name: Set image reference
        id: image
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/docker-context
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${DIGEST}" > "${RUNNER_TEMP}/digests/amd64"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digests/amd64
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build static binary
        run: cargo build --locked --release --target aarch64-unknown-linux-musl

      - name: Prepare Docker build context
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-context"
          cp target/aarch64-unknown-linux-musl/release/ddns4cf "${RUNNER_TEMP}/docker-context/ddns4cf"
          cp docker/Dockerfile "${RUNNER_TEMP}/docker-context/Dockerfile"

      - name: Set image reference
        id: image
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/docker-context
          platforms: linux/arm64
          provenance: false
          outputs: type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${DIGEST}" > "${RUNNER_TEMP}/digests/arm64"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digests/arm64
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    needs:
      - build-amd64
      - build-arm64
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set image reference
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          version="${GITHUB_REF_NAME#v}"
          [[ -n "$version" ]] || { echo "Tag must contain a version after 'v'." >&2; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifest
        run: |
          amd64_digest="$(cat "${RUNNER_TEMP}/digests/amd64")"
          arm64_digest="$(cat "${RUNNER_TEMP}/digests/arm64")"
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${amd64_digest}" \
            "${IMAGE}@${arm64_digest}"
